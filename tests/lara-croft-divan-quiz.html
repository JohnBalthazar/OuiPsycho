<title>Quel genre de Lara Croft êtes-vous ?</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://ouipsycho.fr/articles/lara-croft-divan-psychologie-aventuriere/">
<meta name="description" content="Quel genre de Lara Croft êtes-vous ? Téméraire, stratège ou empathique ? Un test de personnalité.">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:#3a322e;background:transparent;line-height:1.55;display:flex;justify-content:center;padding:4px}
  .quiz{width:100%;max-width:560px;background:#fff7f2;border:1px solid #f0ddd0;border-radius:16px;padding:26px 24px}
  .quiz-header{text-align:center;margin-bottom:22px}
  .quiz-header__img{display:block;width:100%;height:150px;object-fit:cover;border-radius:12px;margin-bottom:16px}
  .quiz-header__title{font-size:1.22rem;line-height:1.35;color:#5a3d2e;margin-bottom:8px}
  .quiz-header__desc{color:#b08368;font-size:.92rem;line-height:1.55}
  .progress{height:8px;background:#f1e2d8;border-radius:99px;overflow:hidden;margin-bottom:22px}
  .progress > span{display:block;height:100%;width:0;background:linear-gradient(90deg,#e8a07d,#d97a55);border-radius:99px;transition:width .35s ease}
  .step-info{font-size:.82rem;letter-spacing:.04em;text-transform:uppercase;color:#b08368;margin-bottom:10px;font-weight:600}
  h2{font-size:1.28rem;line-height:1.35;margin-bottom:20px;color:#5a3d2e}
  .opt{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid #ecd9cc;color:#3a322e;border-radius:12px;padding:14px 16px;margin-bottom:11px;font-size:1rem;cursor:pointer;transition:all .18s ease}
  .opt:hover{border-color:#d97a55;background:#fdeee5;transform:translateY(-1px)}
  .intro p,.result p{margin-bottom:16px}
  .intro{text-align:center}
  .emoji{font-size:2.6rem;display:block;margin-bottom:12px}
  .btn{display:inline-block;background:#d97a55;color:#fff;border:none;border-radius:99px;padding:13px 28px;font-size:1rem;font-weight:600;cursor:pointer;transition:background .18s ease}
  .btn:hover{background:#c9683f}
  .result{text-align:center}
  .result .tag{display:inline-block;background:#fbe6da;color:#b35a35;border-radius:99px;padding:5px 14px;font-size:.8rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:14px}
  .result h2{margin-bottom:14px}
  .result .desc{text-align:left;background:#fff;border:1px solid #f0ddd0;border-radius:12px;padding:18px;margin-bottom:20px}
  .restart{margin-top:6px;background:none;border:none;color:#b08368;font-size:.92rem;cursor:pointer;text-decoration:underline}
  .restart:hover{color:#d97a55}
</style>
</head>
<body>
<div class="quiz">
  <div class="quiz-header">
    <img class="quiz-header__img" src="https://res.cloudinary.com/druutw29p/image/upload/f_auto,q_auto,w_1200/ouipsycho/articles/o6zaqxwfylbkqj7p5fno" alt="" loading="lazy">
    <h1 class="quiz-header__title">Quel genre de Lara Croft êtes-vous ?</h1>
    <p class="quiz-header__desc">Six questions pour révéler l'aventurière qui sommeille en vous. Répondez spontanément, sans trop réfléchir.</p>
  </div>
  <div id="quiz"></div>
</div>
<script>
(function(){
  var questions=[
    {q:"Un temple oublié se dresse devant vous. Votre premier réflexe ?",
     a:[{t:"Foncer à l'intérieur, on verra bien.",p:"A"},
        {t:"Étudier les plans et les inscriptions avant d'entrer.",p:"B"},
        {t:"Y aller seule, sans prévenir personne.",p:"C"},
        {t:"Vérifier d'abord que tout le monde est en sécurité.",p:"D"}]},
    {q:"Votre idée des vacances parfaites ?",
     a:[{t:"Saut en parachute au-dessus d'un volcan.",p:"A"},
        {t:"Une expo d'archéologie et un bon livre.",p:"B"},
        {t:"Une cabane isolée, loin de tout et de tous.",p:"C"},
        {t:"Un grand week-end avec les gens que vous aimez.",p:"D"}]},
    {q:"Face à un imprévu, vous êtes plutôt...",
     a:[{t:"Action immédiate : l'instinct d'abord.",p:"A"},
        {t:"Plan B, plan C, plan D déjà prêts.",p:"B"},
        {t:"Vous gérez seule, sans demander d'aide.",p:"C"},
        {t:"Vous réunissez tout le monde pour décider ensemble.",p:"D"}]},
    {q:"Ce qui vous fait vraiment vibrer ?",
     a:[{t:"L'adrénaline et le dépassement de soi.",p:"A"},
        {t:"Résoudre une énigme que personne ne comprend.",p:"B"},
        {t:"Votre liberté, sans comptes à rendre.",p:"C"},
        {t:"Aider quelqu'un et voir son sourire.",p:"D"}]},
    {q:"Votre plus grande qualité, soyons honnêtes ?",
     a:[{t:"Le courage (un peu trop, parfois).",p:"A"},
        {t:"La logique imparable.",p:"B"},
        {t:"L'autonomie totale.",p:"C"},
        {t:"L'empathie sans limites.",p:"D"}]},
    {q:"Et votre petit défaut, alors ?",
     a:[{t:"Vous foncez avant de réfléchir.",p:"A"},
        {t:"Vous sur-analysez absolument tout.",p:"B"},
        {t:"Vous avez du mal à demander de l'aide.",p:"C"},
        {t:"Vous vous oubliez pour les autres.",p:"D"}]}
  ];
  var profiles={
    A:{emoji:"⚡",tag:"Profil A",name:"L'Exploratrice intrépide",
       desc:"Vous êtes la Lara des grands sauts. Le danger vous galvanise et l'action est votre langue maternelle. Votre courage est contagieux, mais pensez parfois à regarder où vous mettez les pieds : la plus belle des aventurières a aussi le droit de souffler."},
    B:{emoji:"🧩",tag:"Profil B",name:"La Cérébrale stratège",
       desc:"Vous êtes la Lara qui déchiffre les énigmes là où les autres tirent au pistolet. Calme, méthodique, redoutablement futée, vous voyez trois coups à l'avance. Votre défi : accepter qu'on ne puisse pas tout planifier, et laisser un peu de place à l'imprévu."},
    C:{emoji:"🌑",tag:"Profil C",name:"L'Âme indépendante",
       desc:"Vous êtes la Lara solitaire, libre comme l'air et autosuffisante. Vous avancez seule, et vous le faites bien. Mais souvenez-vous : demander de l'aide n'est pas une faiblesse, c'est une autre forme de courage. Laissez parfois quelqu'un porter le sac à dos."},
    D:{emoji:"❤️",tag:"Profil D",name:"La Protectrice au grand cœur",
       desc:"Vous êtes la Lara qui sauve d'abord les autres. Empathique, loyale, rassembleuse, vous transformez chaque expédition en aventure collective. Votre mission secrète : penser un peu plus à vous. On ne protège bien les autres qu'en prenant soin de soi."}
  };

  var box=document.getElementById('quiz');
  var step=-1; var answers=[];

  function notifyResize(){
    setTimeout(function(){
      window.parent.postMessage({type:'quiz-resize',height:document.body.scrollHeight},'*');
    },50);
  }

  function renderIntro(){
    box.innerHTML='<div class="intro"><button class="btn" id="start">Commencer l\'expédition</button></div>';
    document.getElementById('start').onclick=function(){step=0;answers=[];renderQ();};
    notifyResize();
  }

  function renderQ(){
    var item=questions[step];
    var pct=Math.round((step/questions.length)*100);
    var html='<div class="progress"><span style="width:'+pct+'%"></span></div>'+
      '<div class="step-info">Question '+(step+1)+' / '+questions.length+'</div>'+
      '<h2>'+item.q+'</h2>';
    for(var i=0;i<item.a.length;i++){
      html+='<button class="opt" data-p="'+item.a[i].p+'">'+item.a[i].t+'</button>';
    }
    box.innerHTML=html;
    var opts=box.querySelectorAll('.opt');
    for(var j=0;j<opts.length;j++){
      opts[j].onclick=function(){
        answers.push(this.getAttribute('data-p'));
        step++;
        if(step<questions.length){renderQ();}else{renderResult();}
      };
    }
    notifyResize();
  }

  function renderResult(){
    var counts={A:0,B:0,C:0,D:0};
    for(var i=0;i<answers.length;i++){counts[answers[i]]++;}
    var best='A',max=-1,order=['A','B','C','D'];
    for(var k=0;k<order.length;k++){if(counts[order[k]]>max){max=counts[order[k]];best=order[k];}}
    var p=profiles[best];
    box.innerHTML='<div class="result">'+
      '<div class="progress"><span style="width:100%"></span></div>'+
      '<span class="emoji">'+p.emoji+'</span>'+
      '<span class="tag">'+p.tag+'</span>'+
      '<h2>'+p.name+'</h2>'+
      '<div class="desc">'+p.desc+'</div>'+
      '<button class="restart" id="again">Refaire le test</button></div>';
    document.getElementById('again').onclick=renderIntro;
    notifyResize();
  }

  renderIntro();
  window.addEventListener('load',notifyResize);
})();
</script>
</body>
</html>
