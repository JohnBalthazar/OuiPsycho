<html lang="fr">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quel Doctor Doom sommeille en vous ?</title>
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://ouipsycho.fr/articles/doctor-doom-sur-le-divan-psychologie-savant-fou/">
  <meta name="description" content="Contrôle, masque, couronne ou rancune : dix questions pour découvrir quelle armure vous portez. Un test inspiré du Docteur Fatalis.">
  <style>
    :root{
      --fer:#2F3B42;
      --vert:#1B5E45;
      --vert-clair:#E6F0EA;
      --or:#B8912F;
      --fond:#F8F6F1;
      --texte:#1F2933;
      --gris:#6B7780;
      --bord:#DCD8CF;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      background:transparent;color:var(--texte);line-height:1.6;padding:0;
    }
    .wrap{
      background:var(--fond);border:1px solid var(--bord);border-radius:14px;
      padding:26px 22px 30px;max-width:720px;margin:0 auto;
    }
    .head{text-align:center;margin-bottom:20px}
    .head .emo{font-size:34px;display:block;margin-bottom:6px}
    .head h1{font-size:21px;line-height:1.3;color:var(--fer);letter-spacing:-.2px}
    .head p{font-size:14px;color:var(--gris);margin-top:6px}
    .bar{height:6px;background:var(--bord);border-radius:99px;overflow:hidden;margin:18px 0 6px}
    .bar span{display:block;height:100%;background:var(--vert);width:0;transition:width .35s ease}
    .count{font-size:12px;color:var(--gris);text-align:right;margin-bottom:16px;letter-spacing:.4px;text-transform:uppercase}
    .q{font-size:17px;font-weight:600;color:var(--fer);margin-bottom:16px;line-height:1.45}
    .opts{display:flex;flex-direction:column;gap:10px}
    .opt{
      text-align:left;background:#fff;border:1px solid var(--bord);border-radius:10px;
      padding:13px 15px;font-size:15px;color:var(--texte);cursor:pointer;
      font-family:inherit;line-height:1.45;transition:border-color .15s,transform .1s,background .15s;
    }
    .opt:hover{border-color:var(--vert);background:var(--vert-clair)}
    .opt:active{transform:scale(.99)}
    .nav{margin-top:18px}
    .back{background:none;border:none;color:var(--gris);font-size:13px;cursor:pointer;font-family:inherit;padding:4px 0;text-decoration:underline}
    .res{text-align:center}
    .res .badge{font-size:44px;display:block;margin-bottom:4px}
    .res .kicker{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--or);font-weight:700}
    .res h2{font-size:24px;color:var(--fer);margin:6px 0 4px;letter-spacing:-.3px}
    .res .tag{font-style:italic;color:var(--gris);font-size:15px;margin-bottom:16px}
    .block{background:#fff;border:1px solid var(--bord);border-left:4px solid var(--vert);
      border-radius:8px;padding:14px 16px;margin-bottom:12px;text-align:left;font-size:15px}
    .block b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--vert);margin-bottom:5px}
    .share{margin:20px 0 14px}
    .share p{font-size:13px;color:var(--gris);margin-bottom:10px}
    .share a{
      display:inline-block;margin:4px;padding:9px 14px;border-radius:99px;font-size:14px;
      text-decoration:none;color:#fff;background:var(--fer);font-weight:600;
    }
    .share a:hover{background:var(--vert)}
    .again{
      background:var(--vert);color:#fff;border:none;border-radius:99px;padding:12px 26px;
      font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:4px;
    }
    .again:hover{background:var(--fer)}
    .disc{
      margin-top:20px;padding:13px 15px;background:#FFF6E5;border:1px solid #F0DFB8;
      border-radius:8px;font-size:13px;color:#6B5A2E;text-align:left;line-height:1.55;
    }
    @media(max-width:480px){
      .wrap{padding:20px 15px 24px;border-radius:12px}
      .head h1{font-size:19px}
      .q{font-size:16px}
      .opt{font-size:14.5px}
      .res h2{font-size:21px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="emo">🛡️</span>
    <h1>Quel Doctor Doom sommeille en vous ?</h1>
    <p>10 questions, aucune couronne requise.</p>
  </div>
  <div id="app"></div>
</div>

<script>
(function(){
  var SHARE_URL = "https://ouipsycho.fr/articles/doctor-doom-sur-le-divan-psychologie-savant-fou/";

  var PROFILS = {
    souverain: {
      emoji:"👑",
      nom:"Le Souverain",
      tag:"« Le monde tournerait mieux si on vous écoutait. »",
      psy:"Vous fonctionnez à la reconnaissance. Avoir raison n'est pas un plaisir, c'est un besoin — et c'est la signature du versant grandiose du narcissisme, ce sentiment d'être à part qui donne du carburant… tant que personne ne le conteste. Le pouvoir, quand il n'est jamais contredit, finit par abîmer le jugement : c'est ce que décrit le syndrome d'hubris.",
      risque:"Vous confondez désaccord et manque de respect. Résultat : de moins en moins de gens osent vous dire ce qui ne va pas, et vous vous retrouvez très bien entouré, et très seul.",
      antidote:"Cette semaine, demandez à quelqu'un de vous contredire sur un sujet où vous êtes sûr de vous. Puis ne répondez pas. Écoutez juste."
    },
    architecte: {
      emoji:"📐",
      nom:"L'Architecte",
      tag:"« Ce n'est pas du contrôle, c'est de l'anticipation. »",
      psy:"Votre armure, c'est le plan B. Et le C. Le contrôle est un anxiolytique redoutablement efficace à court terme : anticiper fait réellement baisser l'angoisse. Le piège, c'est qu'il la nourrit à long terme — plus on maîtrise, moins on tolère l'imprévu, et plus il faut maîtriser.",
      risque:"Le perfectionnisme n'est pas une quête d'excellence, c'est une fuite de la faute. À force, vous ne déléguez plus rien et vous vous plaignez d'être seul à tout porter.",
      antidote:"Choisissez une chose sans importance et faites-la mal exprès. Constatez que la Latvérie ne s'effondre pas."
    },
    masque: {
      emoji:"🎭",
      nom:"Le Masqué",
      tag:"« On vous connaît beaucoup. On vous connaît mal. »",
      psy:"Vous préparez une version présentable de vous-même avant chaque interaction. C'est le mécanisme de la honte, cette émotion qui ne vise pas l'acte mais la personne entière — là où la culpabilité dit « j'ai mal fait », la honte dit « je suis raté ». Le masque protège efficacement… et empêche tout lien véritable.",
      risque:"Vous êtes épuisé après les interactions sociales sans comprendre pourquoi : jouer un rôle en continu coûte énormément d'énergie.",
      antidote:"Dites une seule chose vraie et non préparée à une personne de confiance cette semaine. Une seule suffit pour commencer."
    },
    vengeur: {
      emoji:"⚔️",
      nom:"Le Rancunier",
      tag:"« Vous n'oubliez pas. Jamais. Et ça vous coûte cher. »",
      psy:"Votre mémoire des offenses est une œuvre d'art. Les travaux sur l'agressivité montrent que la violence ne naît pas d'une faible estime de soi mais d'une estime de soi élevée et menacée. La rumination, elle, donne l'illusion de traiter le problème alors qu'elle ne fait que l'entretenir.",
      risque:"La vengeance est délicieuse en anticipation et décevante en exécution : une fois le coup porté, la blessure est toujours là, parce qu'elle n'était pas à l'extérieur.",
      antidote:"Prenez la plus vieille de vos rancunes et écrivez ce qu'elle vous coûte, en heures de pensée. Le chiffre est en général édifiant."
    }
  };

  var ORDRE = ["souverain","architecte","masque","vengeur"];

  var Q = [
    { q:"En réunion, quelqu'un critique votre travail devant tout le monde. Votre premier réflexe intérieur ?",
      a:[ {t:"Vous notez le nom. Mentalement. En gras.", p:"vengeur"},
          {t:"Vous souriez et vous vous appliquez à ne rien laisser paraître.", p:"masque"},
          {t:"Vous expliquez calmement pourquoi la personne se trompe.", p:"souverain"},
          {t:"Vous repassez tout le dossier pour trouver la faille avant qu'un autre ne la trouve.", p:"architecte"} ] },

    { q:"Votre définition très personnelle d'une bonne journée ?",
      a:[ {t:"Un planning qui tient de bout en bout.", p:"architecte"},
          {t:"Qu'on reconnaisse enfin ce que vous valez.", p:"souverain"},
          {t:"Qu'on vous fiche la paix avec vos zones d'ombre.", p:"masque"},
          {t:"Qu'une injustice ancienne se retourne enfin.", p:"vengeur"} ] },

    { q:"On vous propose de diriger un petit pays d'Europe centrale. Vous répondez…",
      a:[ {t:"Vous demandez d'abord les comptes, le cadastre et l'organigramme.", p:"architecte"},
          {t:"Oui, surtout pour montrer à certains ce dont vous êtes capable.", p:"vengeur"},
          {t:"Oui. Évidemment. C'était même un peu long à venir.", p:"souverain"},
          {t:"Uniquement si vous pouvez gouverner sans jamais être exposé.", p:"masque"} ] },

    { q:"Une photo de vous circule et vous détestez votre tête dessus.",
      a:[ {t:"Vous en publiez une meilleure dans l'heure.", p:"souverain"},
          {t:"Suppression immédiate, négociation ferme si nécessaire.", p:"masque"},
          {t:"Vous instaurez une règle : plus aucune photo sans validation.", p:"architecte"},
          {t:"Vous en voulez sérieusement à la personne qui l'a prise.", p:"vengeur"} ] },

    { q:"Un projet échoue à cause d'une erreur. La vôtre.",
      a:[ {t:"Vous y repensez le soir. Et le mois suivant.", p:"vengeur"},
          {t:"Post-mortem en douze points pour que ça n'arrive plus jamais.", p:"architecte"},
          {t:"Le système était mal fichu, votre part est marginale.", p:"souverain"},
          {t:"Vous n'en parlez à personne. Jamais.", p:"masque"} ] },

    { q:"Sur un divan, qu'est-ce qui vous coûterait le plus ?",
      a:[ {t:"Enlever le masque.", p:"masque"},
          {t:"Lâcher le contrôle du déroulé de la séance.", p:"architecte"},
          {t:"Admettre que quelqu'un a compris avant vous.", p:"souverain"},
          {t:"Renoncer à une rancune bien mûre.", p:"vengeur"} ] },

    { q:"Vos proches diraient de vous que…",
      a:[ {t:"vous anticipez absolument tout.", p:"architecte"},
          {t:"on ne sait jamais vraiment ce que vous pensez.", p:"masque"},
          {t:"vous n'oubliez rien ni personne.", p:"vengeur"},
          {t:"vous avez du charisme et un avis sur tout.", p:"souverain"} ] },

    { q:"Vacances de rêve, budget illimité :",
      a:[ {t:"Une suite avec vue et votre nom à la réception.", p:"souverain"},
          {t:"Itinéraire minuté, tout réservé trois mois à l'avance.", p:"architecte"},
          {t:"La même destination que celui qui vous a snobé, mais en mieux.", p:"vengeur"},
          {t:"Un endroit où absolument personne ne vous connaît.", p:"masque"} ] },

    { q:"Quand vous parlez de vos réussites…",
      a:[ {t:"vous décrivez surtout la méthode employée.", p:"architecte"},
          {t:"vous pensez à ceux qui n'y croyaient pas.", p:"vengeur"},
          {t:"vous n'en parlez pas, ou alors très en dessous.", p:"masque"},
          {t:"vous en parlez volontiers, faits et chiffres à l'appui.", p:"souverain"} ] },

    { q:"Une machine à remonter le temps, un seul aller-retour. Vous…",
      a:[ {t:"allez effacer un souvenir que personne ne doit connaître.", p:"masque"},
          {t:"retournez corriger une humiliation très précise.", p:"vengeur"},
          {t:"optimisez trois décisions clés de votre parcours.", p:"architecte"},
          {t:"allez jeter un œil au sommet que vous atteindrez.", p:"souverain"} ] }
  ];

  var app = document.getElementById('app');
  var idx = 0;
  var reponses = [];

  function notifyResize() {
    setTimeout(function() {
      window.parent.postMessage({ type: 'quiz-resize', height: document.body.scrollHeight }, '*');
    }, 50);
  }

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function render(){
    if(idx >= Q.length){ resultat(); return; }
    var item = Q[idx];
    var pct = Math.round((idx / Q.length) * 100);
    var h = '<div class="bar"><span style="width:' + pct + '%"></span></div>';
    h += '<div class="count">Question ' + (idx+1) + ' / ' + Q.length + '</div>';
    h += '<div class="q">' + esc(item.q) + '</div><div class="opts">';
    for(var i=0;i<item.a.length;i++){
      h += '<button class="opt" data-i="' + i + '">' + esc(item.a[i].t) + '</button>';
    }
    h += '</div>';
    if(idx > 0){ h += '<div class="nav"><button class="back" id="back">← Question précédente</button></div>'; }
    app.innerHTML = h;

    var btns = app.querySelectorAll('.opt');
    for(var j=0;j<btns.length;j++){
      btns[j].addEventListener('click', function(){
        reponses[idx] = Q[idx].a[parseInt(this.getAttribute('data-i'),10)].p;
        idx++;
        render();
      });
    }
    var b = document.getElementById('back');
    if(b){ b.addEventListener('click', function(){ idx--; render(); }); }
    notifyResize();
  }

  function resultat(){
    var scores = {souverain:0, architecte:0, masque:0, vengeur:0};
    for(var i=0;i<reponses.length;i++){ scores[reponses[i]]++; }
    var best = ORDRE[0];
    for(var k=0;k<ORDRE.length;k++){
      if(scores[ORDRE[k]] > scores[best]){ best = ORDRE[k]; }
    }
    var p = PROFILS[best];

    var texte = "Mon profil : " + p.nom + " — Quel Doctor Doom sommeille en vous ?";
    var u = encodeURIComponent(SHARE_URL);
    var t = encodeURIComponent(texte);
    var wa = encodeURIComponent(texte + " " + SHARE_URL);

    var h = '<div class="bar"><span style="width:100%"></span></div><div class="res">';
    h += '<span class="badge">' + p.emoji + '</span>';
    h += '<div class="kicker">Votre armure</div>';
    h += '<h2>' + esc(p.nom) + '</h2>';
    h += '<div class="tag">' + esc(p.tag) + '</div>';
    h += '<div class="block"><b>Ce que dit la psycho</b>' + esc(p.psy) + '</div>';
    h += '<div class="block"><b>Le risque</b>' + esc(p.risque) + '</div>';
    h += '<div class="block"><b>L\'antidote de la semaine</b>' + esc(p.antidote) + '</div>';
    h += '<div class="share"><p>Partagez votre profil (les Avengers apprécieront) :</p>';
    h += '<a href="https://www.facebook.com/sharer/sharer.php?u=' + u + '" target="_blank" rel="noopener">👍 Facebook</a>';
    h += '<a href="https://twitter.com/intent/tweet?text=' + t + '&url=' + u + '" target="_blank" rel="noopener">🐦 Twitter</a>';
    h += '<a href="https://wa.me/?text=' + wa + '" target="_blank" rel="noopener">💬 WhatsApp</a>';
    h += '</div>';
    h += '<button class="again" id="again">↺ Recommencer le test</button>';
    h += '<div class="disc">⚕️ <strong>Rappel important :</strong> Ce questionnaire est un outil de réflexion, pas un diagnostic. Seul un professionnel de santé peut évaluer votre situation. En cas de détresse, appelez le <strong>3114</strong> (gratuit, 24h/24).</div>';
    h += '</div>';
    app.innerHTML = h;

    document.getElementById('again').addEventListener('click', function(){
      idx = 0; reponses = []; render(); notifyResize();
    });
    notifyResize();
  }

  render();
  window.addEventListener('load', notifyResize);
})();
</script>
</body>
</html>
